name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Test, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_team
          POSTGRES_PASSWORD: agent_team_local
          POSTGRES_DB: agent_team_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_team -d agent_team_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://agent_team:agent_team_local@localhost:5432/agent_team_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
